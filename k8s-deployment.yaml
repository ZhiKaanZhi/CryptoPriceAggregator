apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-price-api-deployment
spec:
  replicas: 1 # How many copies of the app you want
  selector:
    matchLabels:
      app: crypto-price-api
  template:
    metadata:
      labels:
        app: crypto-price-api
    spec:
      containers:
      - name: crypto-price-api
        image: crypto-price-api:local # Matches the tag we built in Phase 1
        # IMPORTANT: 'Never' or 'IfNotPresent' ensures K8s uses the local image 
        # and doesn't try to pull from the internet.
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: DOTNET_USE_POLLING_FILE_WATCHER
          value: "1"
        # .NET 8 defaults to port 8080. We force it to 80 to match your Dockerfile EXPOSE.
        - name: ASPNETCORE_HTTP_PORTS 
          value: "80"

---

apiVersion: v1
kind: Service
metadata:
  name: crypto-price-api-service
spec:
  type: LoadBalancer # Exposes the service outside the cluster
  selector:
    app: crypto-price-api
  ports:
    - protocol: TCP
      port: 5000      # The port you will visit in the browser (matches your docker-compose)
      targetPort: 80  # The port the container is listening on